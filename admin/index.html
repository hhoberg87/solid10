<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solidten Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a12;
      --surface:   #13131f;
      --border:    #24243a;
      --purple:    #8b5cf6;
      --purple-dim:#4c1d95;
      --text:      #e8e8f0;
      --muted:     #6b6b8a;
      --red:       #ef4444;
      --amber:     #f59e0b;
      --green:     #10b981;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    /* ── Login ──────────────────────────────────────────────────────────────── */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
    }

    .login-logo {
      display: block;
      height: 56px;
      margin: 0 auto 28px;
    }

    .login-title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 4px;
    }

    .login-sub {
      color: var(--muted);
      text-align: center;
      margin-bottom: 28px;
      font-size: 13px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .05em;
      margin-bottom: 6px;
    }

    input[type=email], input[type=password] {
      display: block;
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      padding: 11px 14px;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 16px;
    }

    input[type=email]:focus, input[type=password]:focus { border-color: var(--purple); }

    .btn-primary {
      display: block;
      width: 100%;
      background: var(--purple);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 13px;
      cursor: pointer;
      transition: opacity .15s;
    }

    .btn-primary:hover   { opacity: .88; }
    .btn-primary:active  { opacity: .75; }
    .btn-primary:disabled { opacity: .45; cursor: not-allowed; }

    #login-error {
      color: var(--red);
      font-size: 13px;
      text-align: center;
      margin-top: 14px;
      min-height: 18px;
    }

    /* ── Dashboard shell ────────────────────────────────────────────────────── */
    #dashboard { display: none; flex-direction: column; height: 100vh; }

    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
      z-index: 10;
    }

    .topbar img { height: 32px; }

    .topbar-title { font-size: 15px; font-weight: 700; flex: 1; }
    .topbar-email { color: var(--muted); font-size: 13px; }

    .btn-link {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 12px;
      padding: 6px 12px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }

    .btn-link:hover { color: var(--text); border-color: var(--muted); }

    /* ── App layout (sidebar + content) ─────────────────────────────────────── */
    #app-layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ────────────────────────────────────────────────────────────── */
    .sidebar {
      width: 224px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      flex-shrink: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      padding: 16px 10px 24px;
    }

    .nav-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
      padding: 0 8px;
      margin-bottom: 8px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 9px 10px;
      border-radius: 8px;
      cursor: pointer;
      color: var(--muted);
      font-size: 13px;
      font-weight: 500;
      transition: background .12s, color .12s;
      user-select: none;
      margin-bottom: 2px;
    }

    .nav-item:hover  { background: rgba(255,255,255,.05); color: var(--text); }
    .nav-item.active { background: rgba(139,92,246,.15);  color: var(--purple); }

    .nav-icon { font-size: 15px; width: 20px; text-align: center; flex-shrink: 0; }

    .nav-chevron {
      margin-left: auto;
      font-size: 11px;
      transition: transform .2s;
      opacity: .6;
    }

    .nav-chevron.open { transform: rotate(180deg); opacity: 1; }

    /* Subnav */
    .subnav { padding: 2px 4px 6px 28px; display: none; }
    .subnav.open { display: block; }

    .subnav-item {
      display: flex;
      align-items: center;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      transition: background .12s, color .12s;
      margin-bottom: 1px;
    }

    .subnav-item:hover  { background: rgba(255,255,255,.04); color: var(--text); }
    .subnav-item.active { background: rgba(139,92,246,.1);   color: var(--purple); }

    .subnav-item-title {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .subnav-new {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 8px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      font-size: 12px;
      border: 1px dashed var(--border);
      margin-top: 6px;
      transition: border-color .15s, color .15s;
    }

    .subnav-new:hover { border-color: var(--purple); color: var(--purple); }

    /* ── Content area ───────────────────────────────────────────────────────── */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 36px 40px;
    }

    .view { display: none; }
    .view.active { display: block; }

    /* ── Stats ──────────────────────────────────────────────────────────────── */
    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 20px;
      flex: 1;
      min-width: 120px;
    }

    .stat-card .num { font-size: 28px; font-weight: 800; line-height: 1; }
    .stat-card .lbl { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .stat-card.red    .num { color: var(--red); }
    .stat-card.amber  .num { color: var(--amber); }
    .stat-card.purple .num { color: var(--purple); }

    .section-heading {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge {
      font-size: 11px;
      font-weight: 700;
      border-radius: 100px;
      padding: 2px 8px;
    }

    .badge-red    { background: rgba(239,68,68,.15);  color: var(--red); }
    .badge-amber  { background: rgba(245,158,11,.15); color: var(--amber); }
    .badge-green  { background: rgba(16,185,129,.15); color: var(--green); }
    .badge-purple { background: rgba(139,92,246,.15); color: var(--purple); }

    /* ── Profile cards ──────────────────────────────────────────────────────── */
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .profile-card-top {
      display: flex;
      gap: 16px;
      padding: 16px;
      align-items: flex-start;
    }

    .photo-gallery {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 0 16px 12px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .photo-gallery::-webkit-scrollbar { height: 4px; }
    .photo-gallery::-webkit-scrollbar-track { background: transparent; }
    .photo-gallery::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .profile-photo {
      width: 120px;
      height: 160px;
      border-radius: 10px;
      object-fit: cover;
      background: var(--bg);
      flex-shrink: 0;
      border: 1px solid var(--border);
    }

    .profile-photo.placeholder {
      width: 120px;
      height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      font-weight: 700;
      color: var(--purple);
      background: var(--purple-dim);
      border-radius: 10px;
      flex-shrink: 0;
    }

    .profile-info { flex: 1; min-width: 0; }

    .profile-name {
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 4px;
    }

    .profile-uid {
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
      margin-bottom: 8px;
      word-break: break-all;
    }

    .profile-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .profile-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .btn-action {
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      cursor: pointer;
      transition: opacity .15s;
    }

    .btn-action:hover   { opacity: .82; }
    .btn-action:active  { opacity: .65; }
    .btn-action:disabled { opacity: .35; cursor: not-allowed; }

    .btn-restore { background: rgba(16,185,129,.18);  color: var(--green); }
    .btn-confirm { background: rgba(245,158,11,.18);  color: var(--amber); }
    .btn-ban     { background: rgba(239,68,68,.18);   color: var(--red); }

    .reports-toggle {
      background: none;
      border: none;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      padding: 10px 16px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color .15s;
    }

    .reports-toggle:hover { color: var(--text); }

    .reports-list { border-top: 1px solid var(--border); display: none; }

    .report-row {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .report-row:last-child { border-bottom: none; }
    .report-category { font-weight: 600; }
    .report-sub { color: var(--muted); font-size: 12px; }
    .report-time { color: var(--muted); font-size: 11px; text-align: right; white-space: nowrap; }

    /* ── Doc home (article cards) ───────────────────────────────────────────── */
    .doc-home-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .doc-home-title { font-size: 22px; font-weight: 700; }

    .btn-new-article {
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 18px;
      cursor: pointer;
      transition: opacity .15s;
    }

    .btn-new-article:hover { opacity: .88; }

    .article-cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 14px;
    }

    .article-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px 20px;
      cursor: pointer;
      transition: border-color .15s, transform .1s;
    }

    .article-card:hover {
      border-color: var(--purple);
      transform: translateY(-1px);
    }

    .article-card-title {
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .article-card-date { font-size: 11px; color: var(--muted); }

    /* ── Article detail ─────────────────────────────────────────────────────── */
    .article-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 6px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .article-title { font-size: 24px; font-weight: 700; line-height: 1.3; }
    .article-meta  { color: var(--muted); font-size: 12px; margin-top: 4px; }

    .article-header-actions { display: flex; gap: 8px; flex-shrink: 0; }

    .btn-edit {
      background: rgba(139,92,246,.15);
      color: var(--purple);
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      cursor: pointer;
      transition: opacity .15s;
    }

    .btn-delete {
      background: rgba(239,68,68,.1);
      color: var(--red);
      border: none;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 14px;
      cursor: pointer;
      transition: opacity .15s;
    }

    .btn-edit:hover   { opacity: .82; }
    .btn-delete:hover { opacity: .82; }

    .article-body {
      margin-top: 28px;
      line-height: 1.8;
      color: var(--text);
      max-width: 760px;
    }

    .article-body h1, .article-body h2, .article-body h3 {
      font-weight: 700;
      margin: 28px 0 12px;
      color: var(--text);
    }

    .article-body h1 { font-size: 20px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
    .article-body h2 { font-size: 17px; }
    .article-body h3 { font-size: 14px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }

    .article-body p { margin: 0 0 14px; }

    .article-body ul, .article-body ol { margin: 0 0 14px 22px; }
    .article-body li { margin-bottom: 6px; }

    .article-body code {
      background: rgba(139,92,246,.12);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 12px;
      color: #c4b5fd;
    }

    .article-body pre {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      overflow-x: auto;
      margin: 0 0 16px;
    }

    .article-body pre code { background: none; padding: 0; color: var(--text); }

    .article-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

    .article-body strong { font-weight: 600; color: var(--text); }

    .article-body blockquote {
      border-left: 3px solid var(--purple);
      padding: 10px 16px;
      margin: 0 0 14px;
      color: var(--muted);
      background: rgba(139,92,246,.06);
      border-radius: 0 6px 6px 0;
    }

    .article-body table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .article-body th, .article-body td {
      text-align: left;
      padding: 8px 12px;
      border: 1px solid var(--border);
    }

    .article-body th { background: rgba(255,255,255,.04); font-weight: 600; }
    .article-body tr:nth-child(even) td { background: rgba(255,255,255,.02); }

    /* ── Article editor ─────────────────────────────────────────────────────── */
    .editor-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      margin-bottom: 24px;
      transition: color .15s;
    }

    .editor-back:hover { color: var(--text); }

    .editor-title-input {
      font-size: 22px;
      font-weight: 700;
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--border);
      color: var(--text);
      padding: 8px 0 10px;
      width: 100%;
      outline: none;
      transition: border-color .15s;
      margin-bottom: 20px;
      display: block;
    }

    .editor-title-input:focus { border-bottom-color: var(--purple); }
    .editor-title-input::placeholder { color: var(--muted); font-weight: 400; }

    .editor-body {
      width: 100%;
      min-height: 520px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.8;
      padding: 18px;
      resize: vertical;
      outline: none;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      transition: border-color .15s;
      display: block;
    }

    .editor-body:focus { border-color: var(--purple); }

    .editor-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }

    .editor-footer { display: flex; gap: 10px; margin-top: 20px; }

    .btn-save {
      background: var(--purple);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 22px;
      cursor: pointer;
      transition: opacity .15s;
    }

    .btn-save:hover   { opacity: .88; }
    .btn-save:disabled { opacity: .45; cursor: not-allowed; }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 13px;
      padding: 10px 22px;
      cursor: pointer;
      transition: color .15s, border-color .15s;
    }

    .btn-cancel:hover { color: var(--text); border-color: var(--muted); }

    /* ── Shared ─────────────────────────────────────────────────────────────── */
    .empty {
      text-align: center;
      color: var(--muted);
      padding: 64px 24px;
    }

    .empty-icon  { font-size: 48px; margin-bottom: 16px; }
    .empty-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 8px; }

    .spinner {
      display: inline-block;
      width: 20px; height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--purple);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-state { text-align: center; padding: 64px 24px; color: var(--muted); }

    @media (max-width: 640px) {
      .sidebar { width: 180px; }
      .content-area { padding: 24px 20px; }
      .report-row { grid-template-columns: 1fr; }
      .report-time { text-align: left; }
    }
  </style>
</head>
<body>

<!-- ── Login ─────────────────────────────────────────────────────────────────── -->
<div id="login-screen">
  <div class="login-card">
    <img class="login-logo" src="../logo.png" alt="Solidten" />
    <p class="login-title">Admin Panel</p>
    <p class="login-sub">Sign in with your admin account</p>

    <label for="email">Email</label>
    <input type="email" id="email" value="hoberg.hannes@gmail.com" autocomplete="email" />

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Password" autocomplete="current-password" />

    <button class="btn-primary" id="login-btn" onclick="doLogin()">Sign in</button>
    <p id="login-error"></p>
  </div>
</div>

<!-- ── Dashboard ──────────────────────────────────────────────────────────────── -->
<div id="dashboard">

  <!-- Top bar -->
  <div class="topbar">
    <img src="../logo.png" alt="Solidten" />
    <span class="topbar-title">Admin Panel</span>
    <span class="topbar-email" id="topbar-email"></span>
    <button class="btn-link" onclick="doSignOut()">Sign out</button>
  </div>

  <div id="app-layout">

    <!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
    <nav class="sidebar">
      <div class="nav-label">Navigation</div>

      <!-- Reporting -->
      <div class="nav-item active" id="nav-reporting" onclick="activateSection('reporting')">
        <span class="nav-icon">🚩</span>
        Reporting
      </div>

      <!-- Documentation -->
      <div class="nav-item" id="nav-docs" onclick="activateSection('docs')">
        <span class="nav-icon">📚</span>
        Documentation
        <span class="nav-chevron" id="docs-chevron">▾</span>
      </div>

      <!-- Subnav: article list -->
      <div class="subnav" id="docs-subnav">
        <div id="docs-list-nav">
          <!-- Populated by renderSidebarArticles() -->
        </div>
        <div class="subnav-new" onclick="openEditor(null)">
          <span>+</span> New article
        </div>
      </div>
    </nav>

    <!-- ── Content area ─────────────────────────────────────────────────────── -->
    <div class="content-area">

      <!-- Reporting view -->
      <div id="view-reporting" class="view active">
        <div class="stats">
          <div class="stat-card red">
            <div class="num" id="stat-hidden">—</div>
            <div class="lbl">Profiles hidden</div>
          </div>
          <div class="stat-card amber">
            <div class="num" id="stat-suspended">—</div>
            <div class="lbl">Accounts suspended</div>
          </div>
          <div class="stat-card purple">
            <div class="num" id="stat-reports">—</div>
            <div class="lbl">Pending reports</div>
          </div>
        </div>

        <div class="section-heading">
          Flagged profiles
          <button class="btn-link" onclick="loadDashboard()" style="font-size:12px">↻ Refresh</button>
        </div>

        <div id="profiles-container">
          <div class="loading-state"><span class="spinner"></span></div>
        </div>
      </div>

      <!-- Doc home (article list) -->
      <div id="view-doc-home" class="view">
        <div class="doc-home-header">
          <div class="doc-home-title">Documentation</div>
          <button class="btn-new-article" onclick="openEditor(null)">+ New article</button>
        </div>
        <div id="article-cards-container" class="article-cards"></div>

async function loadDashboard() {
  const container = document.getElementById('profiles-container');
  container.innerHTML = '<div class="loading-state"><span class="spinner"></span></div>';

  try {
    const [hiddenSnap, suspendedSnap] = await Promise.all([
      db.collection('users').where('profileHidden', '==', true).get(),
      db.collection('users').where('suspended',     '==', true).get(),
    ]);

    const profileMap = new Map();
    for (const doc of [...hiddenSnap.docs, ...suspendedSnap.docs]) {
      if (!profileMap.has(doc.id)) {
        profileMap.set(doc.id, { uid: doc.id, ...doc.data() });
      }
    }

    const profiles    = [...profileMap.values()];
    const withReports = await Promise.all(
      profiles.map(async (p) => {
        const reportsSnap = await db
          .collection('users').doc(p.uid)
          .collection('reports')
          .where('status', '==', 'pending')
          .orderBy('timestamp', 'desc')
          .get();
        return { ...p, reports: reportsSnap.docs.map(d => ({ id: d.id, ...d.data() })) };
      })
    );

    const totalReports = withReports.reduce((n, p) => n + p.reports.length, 0);
    document.getElementById('stat-hidden').textContent    = hiddenSnap.size;
    document.getElementById('stat-suspended').textContent = suspendedSnap.size;
    document.getElementById('stat-reports').textContent   = totalReports;

    if (withReports.length === 0) {
      container.innerHTML = `
        <div class="empty">
          <div class="empty-icon">✅</div>
          <div class="empty-title">All clear</div>
          <p>No flagged profiles right now.</p>
        </div>`;
      return;
    }

    container.innerHTML = '';
    for (const profile of withReports) container.appendChild(buildProfileCard(profile));

  } catch (err) {
    container.innerHTML = `<div class="empty">
      <div class="empty-icon">⚠️</div>
      <div class="empty-title">Error loading data</div>
      <p>${err.message}</p>
    </div>`;
    console.error(err);
  }
}

function buildProfileCard(profile) {
  const card  = document.createElement('div');
  card.className = 'profile-card';
  card.id = `card-${profile.uid}`;

  const photos   = profile.photoUrls || [];
  const photoHtml = photos.length > 0
    ? photos.map(url => `<img class="profile-photo" src="${url}" alt="" loading="lazy" />`).join('')
    : `<div class="profile-photo placeholder">${(profile.name || '?')[0].toUpperCase()}</div>`;

  const statusBadges = [
    profile.banned        ? `<span class="badge badge-red">Banned</span>`    : '',
    profile.suspended     ? `<span class="badge badge-red">Suspended</span>` : '',
    profile.profileHidden ? `<span class="badge badge-amber">Hidden</span>`  : '',
  ].filter(Boolean).join('');

  const rc = profile.reports.length;
  const reportCountBadge = rc > 0
    ? `<span class="badge badge-purple">${rc} pending report${rc !== 1 ? 's' : ''}</span>`
    : `<span class="badge badge-green">No pending reports</span>`;

  const pc = photos.length;
  const photoLabel = pc === 0
    ? '<span style="color:var(--muted);font-size:12px">No photos uploaded</span>'
    : `<span style="color:var(--muted);font-size:12px">${pc} photo${pc !== 1 ? 's' : ''}</span>`;

  card.innerHTML = `
    <div class="profile-card-top">
      <div class="profile-info">
        <div class="profile-name">
          ${escHtml(profile.name || 'Unknown')}
          ${profile.age ? `<span style="font-weight:400;color:var(--muted)">${profile.age}</span>` : ''}
          ${statusBadges}
        </div>
        <div class="profile-uid">${profile.uid}</div>
        <div class="profile-meta">
          ${reportCountBadge}
          ${photoLabel}
          ${profile.city ? `<span style="color:var(--muted);font-size:12px">📍 ${escHtml(profile.city)}</span>` : ''}
        </div>
        <div class="profile-actions">
          <button class="btn-action btn-restore" onclick="takeAction('${profile.uid}','restore')">↩ Restore</button>
          <button class="btn-action btn-confirm" onclick="takeAction('${profile.uid}','confirm')">✓ Keep Hidden</button>
          <button class="btn-action btn-ban"     onclick="takeAction('${profile.uid}','ban')">⛔ Permanent Ban</button>
        </div>
      </div>
    </div>
    <div class="photo-gallery">${photoHtml}</div>
    ${buildReportsSection(profile)}
  `;

  return card;
}

function buildReportsSection(profile) {
  if (profile.reports.length === 0) return '';

  const rows = profile.reports.map(r => {
    const date    = r.timestamp?.toDate?.() || new Date();
    const timeStr = date.toLocaleDateString('en-US', { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
    return `
      <div class="report-row">
        <div>
          <div class="report-category">${escHtml(r.category || 'Other')}</div>
          ${r.subCategory ? `<div class="report-sub">${escHtml(r.subCategory)}</div>` : ''}
        </div>
        <div style="color:var(--muted);font-size:12px">Reporter: <code>${r.reporterId || '—'}</code></div>
        <div class="report-time">${timeStr}</div>
      </div>`;
  }).join('');

  return `
    <button class="reports-toggle" onclick="toggleReports(this)">
      ▶ Show ${profile.reports.length} report${profile.reports.length !== 1 ? 's' : ''}
    </button>
    <div class="reports-list">${rows}</div>

function toggleReports(btn) {

async function takeAction(uid, action) {
  const card = document.getElementById(`card-${uid}`);
  const btns = card.querySelectorAll('.btn-action');
  btns.forEach(b => b.disabled = true);

  const labels     = { restore: 'Restoring…', confirm: 'Confirming…', ban: 'Banning…' };
  const clickedBtn = [...btns].find(b => b.onclick?.toString().includes(`'${action}'`));
  if (clickedBtn) clickedBtn.textContent = labels[action];

  try {
    const userRef   = db.collection('users').doc(uid);
    const reportRef = userRef.collection('reports');
    const updates   = {};
    let   status    = '';

    if (action === 'restore') {
      updates.profileHidden = false;
      updates.suspended     = false;
      status = 'reviewed_restored';
    } else if (action === 'confirm') {
      updates.profileHidden = true;
      status = 'reviewed_confirmed';
    } else if (action === 'ban') {
      updates.banned        = true;
      updates.suspended     = true;
      updates.profileHidden = true;
      status = 'reviewed_banned';
    }

    await userRef.update(updates);

    const pendingSnap = await reportRef.where('status', '==', 'pending').get();
    const batch = db.batch();
    pendingSnap.docs.forEach(d => batch.update(d.ref, {
      status: status,
      reviewedAt: firebase.firestore.FieldValue.serverTimestamp(),
    }));
    await batch.commit();

    card.style.transition = 'opacity .3s';
    card.style.opacity    = '0';
    setTimeout(() => { card.remove(); updateStats(); }, 320);

  } catch (err) {
    alert('Error: ' + err.message);
    btns.forEach(b => b.disabled = false);
    console.error(err);
  }
}

function updateStats() {
  const remaining = document.querySelectorAll('.profile-card').length;

    document.getElementById('profiles-container').innerHTML = `

        <div class="empty-title">All clear</div>
        <p>No flagged profiles right now.</p>
      </div>`;
  }
}

function renderArticleCards() {

function showArticle(articleId) {
  currentArticleId = articleId;
  const article = allArticles.find(a => a.id === articleId);
  if (!article) return;

  document.getElementById('detail-title').textContent = article.title;
  document.getElementById('detail-meta').textContent =
    `Last updated ${fmtDate(article.updatedAt || article.createdAt)}`;
  document.getElementById('detail-body').innerHTML =
    marked.parse(article.content || '');

  setActiveNavItem('doc-detail');
  renderSidebarArticles(); // re-render to update active item
  showView('doc-detail');

  // Make sure docs subnav is open and active
  if (!docsExpanded) expandDocsNav();
  document.getElementById('nav-docs').classList.add('active');
}

function editCurrentArticle() {
  if (!currentArticleId) return;
  openEditor(currentArticleId);
}

function deleteCurrentArticle() {
  if (!currentArticleId) return;
  const article = allArticles.find(a => a.id === currentArticleId);
  if (!article) return;

  if (!confirm(`Delete "${article.title}"? This cannot be undone.`)) return;

  db.collection('docs').doc(currentArticleId).delete().then(() => {
    allArticles = allArticles.filter(a => a.id !== currentArticleId);
    currentArticleId = null;
    renderSidebarArticles();
    renderArticleCards();
    showView('doc-home');
  }).catch(err => {
    alert('Delete failed: ' + err.message);
  });
}

function openEditor(articleId) {
  editorArticleId = articleId;

  if (articleId) {
    const article = allArticles.find(a => a.id === articleId);
    if (!article) return;
    document.getElementById('editor-title').value = article.title;
    document.getElementById('editor-body').value  = article.content || '';
    document.getElementById('editor-save-btn').textContent = 'Save changes';
  } else {
    document.getElementById('editor-title').value = '';
    document.getElementById('editor-body').value  = '';
    document.getElementById('editor-save-btn').textContent = 'Save article';
  }

  if (!docsExpanded) expandDocsNav();
  setActiveNavItem('doc-editor');
  showView('doc-editor');
}

function cancelEditor() {
  if (currentArticleId) {
    showArticle(currentArticleId);
  } else if (allArticles.length > 0) {
    setActiveNavItem('docs');
    showView('doc-home');
  } else {
    activateSection('docs');
  }
}

async function saveArticle() {
  const title   = document.getElementById('editor-title').value.trim();
  const content = document.getElementById('editor-body').value;
  const btn     = document.getElementById('editor-save-btn');

  if (!title) {
    document.getElementById('editor-title').focus();
    return;
  }

  btn.disabled    = true;
  btn.textContent = 'Saving…';

  try {
    const now = firebase.firestore.FieldValue.serverTimestamp();

    if (editorArticleId) {
      // Update existing
      await db.collection('docs').doc(editorArticleId).update({
        title,
        content,
        updatedAt: now,
      });
      const idx = allArticles.findIndex(a => a.id === editorArticleId);
      if (idx >= 0) {
        allArticles[idx] = { ...allArticles[idx], title, content };
      }
      currentArticleId = editorArticleId;
    } else {
      // Create new
      const maxOrder = allArticles.reduce((m, a) => Math.max(m, a.order || 0), 0);
      const ref = await db.collection('docs').add({
        title,
        content,
        order:     maxOrder + 1,
        createdAt: now,
        updatedAt: now,
      });
      const newArticle = {
        id: ref.id,
        title,
        content,
        order: maxOrder + 1,
        createdAt: null,
        updatedAt: null,
      };
      allArticles.push(newArticle);
      currentArticleId = ref.id;
    }

    renderSidebarArticles();
    renderArticleCards();
    showArticle(currentArticleId);

  } catch (err) {
    alert('Save failed: ' + err.message);
    btn.disabled    = false;
    btn.textContent = editorArticleId ? 'Save changes' : 'Save article';
  }
}

The \`getProfilesToRate()\` function in \`RatingService\` builds the queue shown to each user:

1. Loads the current user's \`interestedIn\` preferences from Firestore.
2. If preferences include \`All\` (or are empty), queries all users with \`profileComplete: true\`.
3. Otherwise, applies \`where('gender', whereIn: interestedIn)\` — a Firestore \`whereIn\` filter that returns only profiles matching the user's selected genders.
4. Excludes profiles with \`profileHidden: true\` or \`suspended: true\`.
5. Excludes profiles the current user has already rated (tracked in their \`givenRatings\` subcollection).

## Rating Submission

When a user submits a rating (score 1–10), two Firestore writes happen:

- \`users/{ratedUid}/receivedRatings/{autoId}\` — the rating the profile owner can see in their stats.
- \`users/{currentUid}/givenRatings/{ratedUid}\` — records that this user has already rated that profile, preventing them from rating the same person again.

## Average Rating Display

The displayed rating score is computed client-side from the \`receivedRatings\` subcollection. Whether the score is publicly visible on a user's card is controlled by the \`ratingPublic\` boolean in their user document (toggled in Settings → Privacy).

When a user changes their "Interested In" preference in Settings, \`ProfileService.updateInterestedIn()\` updates only the \`interestedIn\` field. The GoRouter does **not** rebuild on this change because it watches \`profileCompleteProvider\` (which uses \`.distinct()\`) rather than the full profile stream. This was a bug fix: previously, any profile field update caused the router to rebuild and navigate the user back to \`/home\`.

## What Are Bots?

Bots are synthetic user profiles that solve the cold-start problem. Without them, new users would join and see no one to rate and receive no ratings on their own profile.

There are **1,000 bots** in total:

- **30 hand-crafted** profiles (\`bot_01\` – \`bot_30\`) with curated names, cities, genders, and photos
- **970 auto-generated** profiles (\`bot_31\` – \`bot_1000\`) with procedurally assigned names and locations

All bots are identified by the \`isBot: true\` field on their Firestore document. Real user documents never have this field.

## Kill Switch

At the top of \`bots/run_bots.js\`:

\`\`\`js

\`\`\`

Set to \`true\` and re-run \`node run_bots.js\` to reactivate. Set to \`false\` (default) and the script exits immediately without making any changes.

## Synthetic Ratings

Each bot has a pre-seeded \`averageRating\`, \`ratingCount\`, and \`ratingSum\` written directly to their Firestore profile at setup time. This makes them appear in the global ranking immediately.

Ratings are distributed in the **5.2 – 9.0** range using a deterministic formula — approximately 78% of bots have an \`averageRating ≥ 6.0\`, matching the ranking query threshold.

// ── Upsert helper (keeps technical articles in sync with the codebase) ────────
// Checks the canonical seed-ID doc first; falls back to a title-match for
// articles that were originally seeded with a random Firestore ID.
async function upsertNamedArticle(seedId, title, order, content) {
  const now = firebase.firestore.FieldValue.serverTimestamp();
  const seedRef = db.collection('docs').doc(seedId);
  const seedDoc = await seedRef.get();
  if (seedDoc.exists) {
    await seedRef.update({ title, content, updatedAt: now });
    return;
  }
  const snap = await db.collection('docs').where('title', '==', title).limit(1).get();
  if (!snap.empty) {
    await snap.docs[0].ref.update({ content, updatedAt: now });
    return;
  }
  await seedRef.set({ title, content, order, createdAt: now, updatedAt: now });
  console.log('[docs] Created: ' + title);
}

**Trigger:** Firebase Storage object created in \`solidten-prod.firebasestorage.app\`

Only processes files matching \`users/{uid}/photos/{filename}\` and of image content type. Runs Google Cloud Vision SafeSearch. Deletes and flags photos rated LIKELY or VERY_LIKELY for adult content, violence, or racy content.

function isOwner(uid) { return isSignedIn() && request.auth.uid == uid; }
\`\`\`

### Access Rules

| Collection | Read | Write |
|---|---|---|
| \`users/{uid}\` | Any signed-in user | Owner or admin (full write) |
| \`users/{uid}\` stats fields | — | Any signed-in user may update **only** \`ratingSum\`, \`ratingCount\`, \`averageRating\` (needed for the rating transaction) |
| \`users/{uid}/receivedRatings\` | Owner, admin, **or the rater** (\`ratingId == request.auth.uid\`) | Any signed-in user — doc ID must be the rater's UID |
| \`users/{uid}/givenRatings\` | Owner or admin | Owner or admin |
| \`users/{uid}/reports\` | Admin only | Signed-in users (create-only; \`reporterId\` must be own UID; \`status\` must be \`"pending"\`) |
| \`docs/{docId}\` | Admin only | Admin only |

> **Why can the rater read their own receivedRatings entry?**
> Rating submission uses a Firestore transaction that reads the existing \`receivedRatings\` doc first — to detect re-ratings and adjust the running total. Without this read permission the transaction is denied and rolled back silently. The rating appears to submit but is never written, and the queue resets on the next app restart because \`givenRatings\` was never updated. The rule \`ratingId == request.auth.uid\` restricts each user to reading only their own contribution to any profile.

### Rating Stats Write Rule

When a user submits a rating the transaction must update three denormalised fields (\`ratingSum\`, \`ratingCount\`, \`averageRating\`) on the **rated user's** document — which the rater does not own. A targeted rule allows only those three fields to be changed:

\`\`\`javascript
allow update: if isSignedIn()
  && request.resource.data.diff(resource.data).affectedKeys()
       .hasOnly(['ratingSum', 'ratingCount', 'averageRating']);
\`\`\`

### Collection Group

\`/{path=**}/reports/{reportId}\` — admin-only read. Enables the admin panel to query across all users' report subcollections in a single request.

---

## Storage Rules

Defined in \`storage.rules\`. Deployed with:

\`\`\`
firebase deploy --only storage
\`\`\`

| Path | Read | Write |
|---|---|---|
| \`users/{uid}/photos/{photo}\` | Any signed-in user | Owner only |
| \`users/{uid}/thumbs/{photo}\` | Any signed-in user | Cloud Functions service account (Admin SDK) only |

Thumbnails are written exclusively by the \`generateThumbnail\` Cloud Function using the Admin SDK, which bypasses client-facing Storage rules. Regular users cannot write to the \`thumbs/\` path.

async function ensureRatingMatchingArticle() {
  await upsertNamedArticle('seed-rating-matching', 'Rating & Matching System', 8, `## How the Rating Queue Is Built

\`getProfilesToRate()\` in \`RatingService\` (Flutter) builds the queue shown to each user:

1. Loads the current user's \`interestedIn\`, location, \`givingMode\`, and \`givingRadiusMiles\`.
2. Fetches all users with \`profileComplete: true\`.
3. Applies client-side filters (Firestore cannot combine all these conditions in one query):
   - Excludes self and already-rated profiles (checks \`givenRatings\` subcollection)
   - Excludes \`profileHidden\` and \`suspended\` profiles
   - Gender filter based on \`interestedIn\` (bots bypass this — always shown)
   - Giving-mode radius: excludes profiles outside the user's radius if \`givingMode == local\`
   - Receiving-mode per profile: respects \`no_one\`, \`hidden_in_country\`, and \`local\` settings

## Queue Refresh

The queue loads once when the Rating screen first mounts. When the user switches away and returns, it **reloads only if the queue is empty** (all profiles rated, or the initial load failed). Mid-queue position is preserved if there are still profiles remaining.

## Rating Submission (Firestore Transaction)

Rating submission uses a **Firestore transaction** to atomically:

1. Read \`users/{ratedUid}/receivedRatings/{raterUid}\` — detects re-ratings
2. Read \`users/{ratedUid}\` — gets current \`ratingSum\` and \`ratingCount\`
3. Write \`users/{ratedUid}/receivedRatings/{raterUid}\` — score and rater details
4. Write \`users/{raterUid}/givenRatings/{ratedUid}\` — rater's history
5. Update \`users/{ratedUid}\` — new \`ratingSum\`, \`ratingCount\`, \`averageRating\`

Re-ratings are handled correctly: the old score is subtracted and the new score is added, keeping the running total accurate without changing the count.

## Global Ranking

Queries all users with \`averageRating ≥ 6.0\`, ordered descending. This is a \`FutureProvider\` that re-fetches every time the user navigates to the Rankings tab so updated averages are visible without a restart. Users with a score below 6.0 see a locked message instead of the leaderboard.

## Matching

Two users are matched when:
- Each has rated the other, AND
- Their mutual scores differ by at most 1 point

Matches are computed in \`getMatches()\` by cross-referencing \`givenRatings\` and \`receivedRatings\`. Pairs in the \`unmatched\` subcollection are excluded. The match list is a \`FutureProvider\` that re-fetches every time the user navigates to the Messaging tab.

## Conversation Sorting

The messaging list is sorted by \`lastMessageAt\` from the live \`conversationsStreamProvider\` (a Firestore real-time listener). The sort re-evaluates whenever a message is sent or received — no manual refresh needed.

## Image Caching & Thumbnails

All profile photos use \`CachedNetworkImage\` for disk-persistent caching. Photos are stored on-device after the first download and served from cache on subsequent views.

For small avatar contexts (42 px ranking rows, 52 px messaging list), the app uses thumbnail URLs from the \`thumbs\` Firestore map. Thumbnails are ~15 KB vs. up to 4 MB for originals. Full-resolution URLs are used for the profile sheet and rating screen.

The \`thumbFor(photoUrl, thumbs)\` helper in \`rating_service.dart\` extracts the filename from a Firebase Storage URL and returns the matching thumbnail URL, falling back to the full URL if no thumbnail exists yet.

function escHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function fmtDate(ts) {
  if (!ts) return '—';
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
}
